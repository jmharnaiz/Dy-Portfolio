<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="demo-project-template.css" />
  <style>
    .total { font-size: 2rem; font-weight: bold; color: #fbbf24; }
    button { background: linear-gradient(135deg, #f59e0b, #ea580c); color: white; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid rgba(148,163,184,0.2); }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1 class="page-title">Expense Tracker</h1>
      <a href="Neil Herbert U. Betacura - Animated Professional Portfolio.html" class="back-link">← Back to Portfolio</a>
    </div>

    <div class="panel">
      <span class="header-badge">Finance Dashboard</span>
      <div class="grid">
      <div class="card"><div>Monthly Total</div><div class="total" id="totalExpense">₱0</div></div>
      <div class="card"><div>Food</div><div class="total" id="foodTotal">₱0</div></div>
      <div class="card"><div>Utilities</div><div class="total" id="utilityTotal">₱0</div></div>
    </div>

    <div class="card" style="margin-top: 20px;">
      <h3>Add Expense</h3>
      <div class="grid">
        <div><label>Title</label><input id="title" type="text" placeholder="Groceries" /></div>
        <div><label>Category</label><select id="category" style="width:100%; padding:10px; border-radius:8px; background:#0f172a; color:white; border:1px solid #4b5563; box-sizing:border-box;">
          <option>Food</option>
          <option>Utilities</option>
          <option>Transport</option>
          <option>Rent</option>
        </select></div>
        <div><label>Amount</label><input id="amount" type="number" value="150" /></div>
      </div>
      <br />
      <button onclick="addExpense()">Add Expense</button>
    </div>

    <div class="card" style="margin-top: 20px;">
      <h3>Expense List</h3>
      <table>
        <thead><tr><th>Title</th><th>Category</th><th>Amount</th></tr></thead>
        <tbody id="expenseList"></tbody>
      </table>
    </div>
  </div>

  <script>
    const expenses = [
      { title: 'Groceries', category: 'Food', amount: 850 },
      { title: 'Electric Bill', category: 'Utilities', amount: 1200 },
      { title: 'Jeep Fare', category: 'Transport', amount: 220 }
    ];

    function renderExpenses() {
      const list = document.getElementById('expenseList');
      list.innerHTML = '';
      let total = 0, food = 0, utility = 0;

      expenses.forEach(expense => {
        total += expense.amount;
        if (expense.category === 'Food') food += expense.amount;
        if (expense.category === 'Utilities') utility += expense.amount;

        const row = document.createElement('tr');
        row.innerHTML = `<td>${expense.title}</td><td>${expense.category}</td><td>₱${expense.amount}</td>`;
        list.appendChild(row);
      });

      document.getElementById('totalExpense').textContent = '₱' + total.toLocaleString();
      document.getElementById('foodTotal').textContent = '₱' + food.toLocaleString();
      document.getElementById('utilityTotal').textContent = '₱' + utility.toLocaleString();
    }

    function addExpense() {
      const title = document.getElementById('title').value.trim();
      const category = document.getElementById('category').value;
      const amount = Number(document.getElementById('amount').value || 0);

      if (!title || amount <= 0) {
        alert('Please enter a valid title and amount.');
        return;
      }

      expenses.push({ title, category, amount });
      renderExpenses();
      document.getElementById('title').value = '';
      document.getElementById('amount').value = 150;
    }

    renderExpenses();
  </script>
</body>
</html>
